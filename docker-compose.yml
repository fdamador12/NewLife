name: newlife
services:

  # ── Backend Web (admin-api) ──────────────────────────────────────
  admin-api:
    # newlife-admin-api.openlab.uninorte.edu.co
    build:
      context: ./backend/admin-api
      dockerfile: Dockerfile
    container_name: newlife-admin-api
    ports:
      - "5180:3001"
    environment:
      PORT: 3001
      # ── Roble ─────────────────────────────────────────────────────
      ROBLE_BASE_URL: ${ROBLE_BASE_URL}
      ROBLE_PROJECT_TOKEN: ${ROBLE_PROJECT_TOKEN}
      ROBLE_DB_NAME: ${ROBLE_DB_NAME}
      ROBLE_SYSTEM_EMAIL: ${ROBLE_SYSTEM_EMAIL}
      ROBLE_SYSTEM_PASSWORD: ${ROBLE_SYSTEM_PASSWORD}
      # ── Admin Auth ────────────────────────────────────────────────
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_JWT_EXPIRES_IN: ${ADMIN_JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # ── MinIO ─────────────────────────────────────────────────────
      # Endpoint interno: el backend habla con MinIO por la red de Docker
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      # Endpoint público: URL que se devuelve al frontend para mostrar imágenes
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC}
      # ── Límites de upload ─────────────────────────────────────────
      MEDIA_MAX_FILE_SIZE_MB: ${MEDIA_MAX_FILE_SIZE_MB}
      MEDIA_MAX_IMAGE_DIMENSION: ${MEDIA_MAX_IMAGE_DIMENSION}
      MEDIA_MIN_IMAGE_DIMENSION: ${MEDIA_MIN_IMAGE_DIMENSION}
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Backend Mobile (api) ─────────────────────────────────────────
  api:
    # newlife-mobile-api.openlab.uninorte.edu.co
    build:
      context: ./backend/mobile-api
      dockerfile: Dockerfile
    container_name: newlife-mobile-api
    ports:
      - "5181:3000"
    env_file:
      - .env
    volumes:
      - ./backend/mobile-api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run start:dev
    restart: unless-stopped

  # ── Frontend Web (Next.js) ───────────────────────────────────────
  frontend-web:
    # newlife.openlab.uninorte.edu.co
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: newlife-frontend-web
    ports:
      - "5182:3000"
    environment:
      NODE_ENV: development
      # Apunta al admin-api en producción
      NEXT_PUBLIC_API_URL: https://newlife-admin-api.openlab.uninorte.edu.co
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - admin-api
    restart: unless-stopped

  # ── Almacenamiento de Media (MinIO) ──────────────────────────────
  minio:
    # newlife-media.openlab.uninorte.edu.co (futuro subdominio)
    image: minio/minio:latest
    container_name: newlife-minio
    ports:
      - "5183:9000" # API compatible con S3
      - "5184:9001" # Consola web (UI admin)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      # Mapea el almacenamiento al disco físico
      - ./media-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      # MinIO Client viene incluido en la imagen oficial.
      # mc ready verifica que MinIO acepta conexiones.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Inicialización de MinIO ──────────────────────────────────────
  # Servicio efímero que se ejecuta una sola vez en cada deploy.
  # Crea el bucket público si no existe y configura el acceso anónimo.
  # Es IDEMPOTENTE: si el bucket ya existe, no falla — solo termina.
  # Después de ejecutarse, el contenedor sale con código 0.
  minio-init:
    image: minio/mc:latest
    container_name: newlife-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC}
    entrypoint: >
      /bin/sh -c "
      echo 'Configurando alias de MinIO...';
      /usr/bin/mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      echo 'Creando bucket público (si no existe)...';
      /usr/bin/mc mb --ignore-existing local/$$MINIO_BUCKET_PUBLIC;
      echo 'Configurando bucket como público (lectura anónima)...';
      /usr/bin/mc anonymous set download local/$$MINIO_BUCKET_PUBLIC;
      echo 'Bucket configurado correctamente. Saliendo.';
      exit 0;
      "
    restart: "no"